<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Candidate Screening Agent</title>
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .standalone-ui-root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-warning: #f59e0b;
            --accent-danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow-glow: 0 0 35px rgba(99, 102, 241, 0.25);
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .standalone-ui-root * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .standalone-ui-root .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .standalone-ui-root .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc, #6366f1, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .standalone-ui-root .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .standalone-ui-root .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .standalone-ui-root .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .standalone-ui-root .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .standalone-ui-root .hero p {
            color: var(--text-muted);
            font-size: 1.15rem;
            max-width: 650px;
            margin: 0 auto 24px;
        }

        .standalone-ui-root .btn-demo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .standalone-ui-root .db-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .standalone-ui-root .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            margin-bottom: 40px;
        }

        .standalone-ui-root .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 28px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .standalone-ui-root .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #f1f5f9;
        }

        .standalone-ui-root select, 
        .standalone-ui-root input[type="text"],
        .standalone-ui-root textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 16px;
            outline: none;
        }

        .standalone-ui-root .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 32px 20px;
            text-align: center;
            background: rgba(15, 23, 42, 0.4);
            cursor: pointer;
        }

        .standalone-ui-root .btn-submit {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-glow);
        }

        .standalone-ui-root .results-container {
            display: none;
        }
    </style>
</head>
<body class="standalone-ui-root">

    <nav class="navbar">
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-robot"></i></div>
            Candidate Screening Agent (Standalone Test Console)
        </div>
        <button class="btn-demo" onclick="runDemoTest()">
            <i class="fa-solid fa-bolt"></i> Run Instant Demo
        </button>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>Find Your Best Candidate with AI</h1>
            <p>Standalone Screening Test Console</p>
        </div>

        <form id="screeningForm" onsubmit="handleFormSubmit(event)">
            <div class="main-grid">
                <div class="card">
                    <div class="card-header">
                        <div><i class="fa-solid fa-database"></i> Job Description</div>
                        <div class="db-status-badge" id="dbStatus">Connected</div>
                    </div>
                    <select id="vendorSelect">
                        <option value="Vendor A">Vendor A</option>
                        <option value="Vendor B">Vendor B</option>
                    </select>
                    <select id="reqSelect" onchange="handleRequisitionSelect()">
                        <option value="">-- Select Requisition --</option>
                    </select>
                    <textarea id="jdText" placeholder="Job Description text..."></textarea>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div><i class="fa-solid fa-folder-open"></i> Candidate Resumes</div>
                    </div>
                    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                        <i class="fa-solid fa-cloud-arrow-up" style="font-size: 2rem; color: #06b6d4;"></i>
                        <p>Click to upload PDF resumes</p>
                        <input type="file" id="fileInput" multiple accept=".pdf" style="display: none;" onchange="renderFileList(event)">
                    </div>
                    <div id="fileList" style="margin-top: 10px;"></div>
                </div>
            </div>

            <button type="submit" class="btn-submit">Screen & Rank Candidates</button>
        </form>
    </div>

    <script>
        async function runDemoTest() {
            alert('Demo test executed.');
        }

        function renderFileList(e) {
            const files = Array.from(e.target.files);
            document.getElementById('fileList').innerHTML = files.map(f => `<div>📄 ${f.name}</div>`).join('');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            alert('Screening request submitted.');
        }

        function handleRequisitionSelect() {}
    </script>
</body>
</html>
