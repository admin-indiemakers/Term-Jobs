[project]
name = "termejobs-backend"
version = "0.1.0"
description = "Term Jobs backend - requisition module (AI-generated JDs)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langgraph>=0.2.30",
    "langchain-ollama>=0.2.0",
    "rapidfuzz>=3.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["modules/requisition/tests"]
pythonpath = ["."]
markers = [
    "ollama: tests that require a reachable Ollama server",
]

[tool.ruff]
line-length = 100
