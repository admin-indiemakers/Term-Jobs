[project]
name = "termejobs-backend"
version = "0.1.0"
description = "Term Jobs backend - requisition module (AI-generated JDs)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langgraph>=0.2.30",
    "langchain-ollama>=0.2.0",
    "rapidfuzz>=3.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "pymongo>=4.8.0",
    "PyMuPDF>=1.28.0",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.5.0",
    "mongomock>=4.1.2",
]

[tool.pytest.ini_options]
testpaths = ["modules/requisition/tests", "modules/identity/tests"]
pythonpath = ["."]
markers = [
    "ollama: tests that require a reachable Ollama server",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "DTZ003"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["modules/candidate_screening_agent", "modules/candidate", "."]


